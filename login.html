<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | CampusConnect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">
    <header class="site-header" id="site-header"></header>
    <main class="auth">
        <div class="auth-box">
            <h1>Welcome Back</h1>
            <p class="meta">Log in to your CampusConnect account.</p>
            <form data-validate novalidate>
                <div class="field"><label for="email">Email</label><input id="email" type="email" required
                        placeholder="you@college.edu"><span class="error"></span></div>
                <div class="field"><label for="pw">Password</label><input id="pw" name="password" type="password"
                        required><button type="button" class="toggle">Show</button><span class="error"></span></div>
                <div class="row"><label><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a>
                </div>
                <button class="btn btn-block" type="submit">Login</button>
                <div class="msg"></div>
            </form>
            <p class="alt-link">New here? <a href="register.html">Create an account</a></p>
        </div>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="main.js"></script>
</body>

</html>
